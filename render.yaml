services:
  - type: web
    name: reelnotifier-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reelnotifier-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reelnotifier-redis
          property: connectionString
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: API_ADMIN_KEY
        generateValue: true
  - type: worker
    name: reelnotifier-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reelnotifier-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reelnotifier-redis
          property: connectionString
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_GRAPH_API_VERSION
        value: v27.0
      - key: API_ADMIN_KEY
        generateValue: true
  - type: keyvalue
    name: reelnotifier-redis
    plan: starter
    ipAllowList: []
databases:
  - name: reelnotifier-db
    plan: basic-256mb
    databaseName: reelnotifier
    user: reelnotifier
